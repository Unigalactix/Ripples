    <radialGradient id="atmosphere" cx="50%" cy="58%" r="60%"><stop stop-color="#648782" stop-opacity=".46"/><stop offset=".6" stop-color="#30505a" stop-opacity=".15"/><stop offset="1" stop-color="#06141e" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x2="100%" y2="30%"><stop stop-color="#947957"/><stop offset=".35" stop-color="#e0c79c"/><stop offset=".65" stop-color="#bfa079"/><stop offset="1" stop-color="#e5d1ad"/></linearGradient>
    <linearGradient id="paintRose" x2="90%" y2="100%"><stop stop-color="#bb7e72"/><stop offset=".55" stop-color="#96646b"/><stop offset="1" stop-color="#21464b"/></linearGradient>
    <linearGradient id="paintGold" x2="40%" y2="100%"><stop stop-color="#d2b487"/><stop offset=".5" stop-color="#a38966"/><stop offset="1" stop-color="#59736b"/></linearGradient>
