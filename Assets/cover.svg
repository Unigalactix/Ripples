<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title description">
  <title id="title">Ripples - A Rajesh Kodaganti's Unavailability</title>
  <desc id="description">A literary cover in deep petrol, warm ivory and muted gold. Expressive painted forms suggest Aarna on the left; precise blue facets suggest Mukund on the right. Their symbolic profiles face a shared field of luminous water ripples.</desc>
  <defs>
