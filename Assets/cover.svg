    <linearGradient id="fade" x2="0" y2="100%"><stop stop-color="#081a25" stop-opacity="0"/><stop offset="1" stop-color="#06151f"/></linearGradient>
    <filter id="brush" x="-12%" y="-8%" width="124%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".013 .05" numOctaves="3" seed="22" result="noise"/>
