<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ripples: a story by Rajesh Kodaganti, told through five waves and two perspectives.">
    <title>Ripples</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css">
    <script src="./content.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#chapter" data-label="skip">Skip to chapter</a>
    <header class="hero">
      <p class="eyebrow" data-label="credit">A story by Rajesh Kodaganti</p>
      <h1 id="book-title">Ripples</h1>
      <p class="subtitle" data-label="subtitle">One day. Two perspectives. Five waves.</p>
      <p class="draft" data-label="status">Chapter outlines - the full story is still being written.</p>
      <div class="language-control">
        <label for="language" data-label="language">Reading language</label>
        <select id="language" disabled><option>English</option></select>
      </div>
    </header>
    <main>
      <p id="error" role="alert" hidden></p>
      <noscript>This interactive reader needs JavaScript enabled to display the chapters.</noscript>
      <nav class="wave-map" aria-labelledby="map-title">
        <h2 id="map-title" data-label="map">The five waves</h2>
        <ol id="waves"></ol>
      </nav>
      <section class="reader" aria-labelledby="chapter-title">
        <div class="reader-tools">
          <label for="perspective" data-label="perspective">Explore a perspective</label>
          <select id="perspective">
            <option value="both" data-label="both">Both perspectives</option>
            <option value="aarna" data-label="aarna">Aarna</option>
            <option value="mukund" data-label="mukund">Mukund</option>
          </select>
        </div>
        <article id="chapter" tabindex="-1">
          <p id="wave-number" class="eyebrow"></p>
          <h2 id="chapter-title"></h2>
          <p id="scene" class="scene"></p>
          <div id="shared"></div>
          <div id="perspectives" class="perspectives"></div>
        </article>
        <div class="pager">
          <button id="previous" type="button" data-label="previous" disabled>Previous wave</button>
          <p id="progress" aria-live="polite" aria-atomic="true"></p>
          <button id="next" type="button" data-label="next" disabled>Next wave</button>
        </div>
      </section>
    </main>
  </body>
</html>
